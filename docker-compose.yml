# One-command local environment for Easy Trading:
#   docker compose up --build
#
# Brings up Postgres (schema + the instrument list) and the Spring Boot
# backend together, wired to talk to each other.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: easytrading
      POSTGRES_USER: easytrading
      POSTGRES_PASSWORD: easytrading
    ports:
      # Host-side port only (left number). Postgres inside the container
      # always listens on 5432 (right number) regardless of this — this
      # just picks which port on your machine forwards to it. 5433 instead
      # of the default 5432 because several of us already have a Postgres
      # installed natively that's sitting on 5432.
      - "5433:5432"
    volumes:
      # Postgres's official image runs any .sql file dropped here, in
      # filename order, the *first* time the data volume is empty.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easytrading -d easytrading"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Spring Boot's relaxed binding maps SPRING_DATASOURCE_URL straight
      # onto spring.datasource.url, overriding application.yml — no code
      # change needed. Only the host differs from the local-dev default:
      # inside Docker's network, containers reach each other by service
      # name ("db"), never "localhost" (that would mean the backend
      # container itself, which has no database in it).
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/easytrading
      DB_PASSWORD: easytrading
      # The two API keys come from a .env file next to this one (copy
      # .env.example) or from the host shell; these lines forward them into
      # the container. Twelve Data is needed for every chart, Finnhub for
      # demo trading's live price.
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
