1b3" stroke-width="1.4"/><line x1="807.0" y1="190.0" x2="653.0" y2="190.0" stroke="#9a6ec9" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arwp)"/><line x1="852.6" y1="222.1" x2="607.4" y2="317.9" stroke="#9a6ec9" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arwp)"/><line x1="885.4" y1="228.7" x2="574.6" y2="471.3" stroke="#9a6ec9" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arwp)"/><line x1="900.5" y1="230.4" x2="559.5" y2="629.6" stroke="#9a6ec9" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arwp)"/><line x1="908.7" y1="231.1" x2="551.3" y2="788.9" stroke="#9a6ec9" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arwp)"/><text x="935" y="258" font-size="11.5" fill="#9a6ec9" text-anchor="middle" font-weight="600" font-style="italic">«extend»  — app-wide</text><line x1="568.7" y1="549.5" x2="891.3" y2="840.5" stroke="#3f9c6b" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arwi)"/><line x1="594.0" y1="705.4" x2="866.0" y2="844.6" stroke="#3f9c6b" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arwi)"/><line x1="645.0" y1="844.6" x2="815.0" y2="865.4" stroke="#3f9c6b" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arwi)"/><text x="935" y="812" font-size="11.5" fill="#3f9c6b" text-anchor="middle" font-weight="600" font-style="italic">«include»</text><path d="M300,1006 h816 l14,14 v68 h-830 v-82 z" fill="#fffdf2" stroke="#d9c98a" stroke-width="1.2"/><path d="M1116,1006 v14 h14" fill="none" stroke="#d9c98a" stroke-width="1.2"/><text x="311" y="1027" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">UC06 has NO secondary actors — no external API and no database. It is static frontend content (no endpoint, no table),</text><text x="311" y="1042" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">and it explains individual terms wherever they appear, so it extends every use case, not only UC02.</text><text x="311" y="1057" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">UC01 Search reads the database only; the Twelve Data call lives in UC02.</text><text x="311" y="1072" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">Solid = association.   Purple dashed = «extend».   Green dashed = «include».</text><text x="1160" y="1080" font-size="11" fill="#5c6b7a" text-anchor="start" font-weight="normal" font-style="italic">Supersedes IMG_2396.png · scope: forex / crypto / stock</text></svg>