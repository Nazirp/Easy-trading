<rect width="1520" height="1110" fill="#ffffff"/><text x="760.0" y="42" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="700" font-style="normal">Easy Trading — Use Case Diagram</text><text x="760.0" y="64" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">redrawn from the use cases and the code, 2026-08-31</text><rect x="300" y="90" width="830" height="900" rx="10" fill="none" stroke="#8fa1b3" stroke-width="1.8"/><text x="715.0" y="116" font-size="15" fill="#5c6b7a" text-anchor="middle" font-weight="600" font-style="normal">Easy Trading</text><g stroke="#1f2933" stroke-width="1.7" fill="none"><circle cx="150" cy="444" r="11"/><line x1="150" y1="455" x2="150" y2="482"/><line x1="134" y1="464" x2="166" y2="464"/><line x1="150" y1="482" x2="137" y2="503"/><line x1="150" y1="482" x2="163" y2="503"/></g><text x="150" y="522" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Beginner Trader</text><text x="150" y="538" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="normal">(primary actor)</text><ellipse cx="525" cy="190" rx="128" ry="42" fill="#eef4ff" stroke="#5b86d6" stroke-width="1.6"/><text x="525" y="195" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">UC01  Search Instrument</text><ellipse cx="525" cy="350" rx="128" ry="42" fill="#eef4ff" stroke="#5b86d6" stroke-width="1.6"/><text x="525" y="347" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">UC02  View Price Chart</text><text x="525" y="364" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">with Signal</text><ellipse cx="525" cy="510" rx="128" ry="42" fill="#eef4ff" stroke="#5b86d6" stroke-width="1.6"/><text x="525" y="515" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">UC03  Manage Watchlist</text><ellipse cx="525"