<rect width="1420" height="1160" fill="#ffffff"/><text x="710.0" y="42" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="700" font-style="normal">Easy Trading — Layered Architecture</text><text x="710.0" y="64" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">redrawn from the code, 2026-09-18 — supersedes the 31 Aug diagram (auth, watchlist and the live price feed were missing from it)</text><rect x="90" y="100" width="800" height="164" rx="7" fill="#f7efff" stroke="#9a6ec9" stroke-width="1.6"/><text x="490.0" y="126" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Presentation layer  ·  static/</text><rect x="118" y="148" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="237" y="167" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">index.html</text><rect x="376" y="148" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="495" y="167" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">js/search.js  ·  js/auth.js</text><rect x="634" y="148" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="753" y="167" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">css/style.css</text><rect x="118" y="186" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="237" y="205" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">demo-trading.html</text><rect x="376" y="186" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="495" y="205" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">js/watchlist.js</text><rect x="634" y="186" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="753" y="205" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">js/demo-trading.js</text><text x="490.0" y="252" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Served by the backend itself — one origin, no separate frontend server.</text><rect x="90" y="300" width="800" height="164" rx="7" fill="#eef4ff" stroke="#5b86d6" stroke-width="1.6"/><text x="490.0" y="326" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">REST layer  ·  *Controller</text><rect x="118" y="348" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="237" y="367" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentController</text><rect x="376" y="348" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="495" y="367" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PriceController</text><rect x="634" y="348" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="753" y="367" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">AuthController</text><rect x="118" y="386" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="237" y="405" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">WatchlistController</text><rect x="376" y="386" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="495" y="405" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">LivePriceController</text><rect x="634" y="386" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="753" y="405" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">ApiExceptionHandler</text><text x="490.0" y="452" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Everything under /api/** is JSON. Never touches a Repository directly.</text><rect x="90" y="500" width="800" height="164" rx="7" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.6"/><text x="490.0" y="526" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Business logic layer  ·  *Service</text><rect x="118" y="548" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="237" y="567" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentSearchService</text><rect x="376" y="548" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="495" y="567" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PriceService  ·  SignalService</text><rect x="634" y="548" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="753" y="567" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">Interval (window + staleness)</text><rect x="118" y="586" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="237" y="605" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">AuthService  ·  SessionUser</text><rect x="376" y="586" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="495" y="605" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">WatchlistService</text><rect x="634" y="586" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="753" y="605" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">LivePriceService · LiveCandleService</text><text x="490.0" y="652" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Owns the candle window, the staleness rule and the live 1 min candle series (LiveChartService joins it to the Twelve Data backfill).</text><rect x="90" y="700" width="800" height="164" rx="7" fill="#e9f7ef" stroke="#3f9c6b" stroke-width="1.6"/><text x="490.0" y="726" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Persistence layer  ·  *Repository</text><rect x="118" y="748" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="237" y="767" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentRepository</text><rect x="376" y="748" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="495" y="767" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PriceRepository</text><rect x="634" y="748" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="753" y="767" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">UserRepository</text><rect x="118" y="786" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="237" y="805" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">WatchlistRepository</text><rect x="376" y="786" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="495" y="805" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">Instrument · Price entities</text><rect x="634" y="786" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="753" y="805" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">User · WatchlistEntry entities</text><text x="490.0" y="852" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Spring Data JPA. ddl-auto: validate — never creates or alters tables.</text><line x1="490.0" y1="264.0" x2="490.0" y2="298.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="490.0" y1="464.0" x2="490.0" y2="498.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="490.0" y1="664.0" x2="490.0" y2="698.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><rect x="90" y="900" width="800" height="104" rx="7" fill="#e9f7ef" stroke="#3f9c6b" stroke-width="1.6"/><text x="490.0" y="926" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">PostgreSQL  ·  db/schema.sql</text><text x="490.0" y="950" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">instrument · price_candle (PK: symbol, interval, datetime) · app_user · watchlist</text><text x="490.0" y="978" font-size="11" fill="#8a5a2b" text-anchor="middle" font-weight="normal" font-style="italic">SQL functions in schema.sql are REFERENCE ONLY — the application never calls them.</text><line x1="490.0" y1="864.0" x2="490.0" y2="898.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><rect x="950" y="500" width="380" height="164" rx="7" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.6"/><text x="1140.0" y="526" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Integration layer  ·  *Client</text><rect x="972" y="552" width="336" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="1140" y="571" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">MarketDataClient → TwelveDataMarketDataClient</text><rect x="972" y="590" width="336" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="1140" y="609" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">LivePriceClient → FinnhubTradeStream (+ REST fallback)</text><text x="1140.0" y="640" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Called by the business logic layer, never by a Controller.</text><line x1="890.0" y1="580.0" x2="948.0" y2="580.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><rect x="950" y="740" width="182" height="118" rx="7" fill="#fff3e3" stroke="#d3902f" stroke-width="1.6"/><text x="1041.0" y="766" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Twelve Data</text><text x="1041" y="786" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">/time_series</text><text x="1041" y="810" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">outputsize is always</text><text x="1041" y="826" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">sent — default is 30</text><rect x="1148" y="740" width="182" height="118" rx="7" fill="#fff3e3" stroke="#d3902f" stroke-width="1.6"/><text x="1239.0" y="766" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Finnhub</text><text x="1239" y="786" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">trade WebSocket</text><text x="1239" y="810" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">~20 trades/s; the REST</text><text x="1239" y="826" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">quote is fallback only</text><line x1="1041.0" y1="666.0" x2="1041.0" y2="738.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="1239.0" y1="666.0" x2="1239.0" y2="738.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><path d="M90,1036 h786 l14,14 v68 h-800 v-82 z" fill="#fffdf2" stroke="#d9c98a" stroke-width="1.2"/><path d="M876,1036 v14 h14" fill="none" stroke="#d9c98a" stroke-width="1.2"/><text x="101" y="1057" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">Layer rule, enforced by naming rather than by folder structure: a Controller always goes through a Service, never</text><text x="101" y="1072" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">straight to a Repository or a Client. Packages are organised by feature — instrument/, price/, marketdata/, liveprice/,</text><text x="101" y="1087" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">user/, watchlist/ — so one use case lives in one folder, and the layer a class belongs to is carried by its</text><text x="101" y="1102" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">*Controller / *Service / *Repository / *Client suffix.</text><text x="710.0" y="1144" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Interfaces are named without an I-prefix: MarketDataClient, not IMarketDataClient. There is no ITradingService.</text></svg>