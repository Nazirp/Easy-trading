<marker id="arwo" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
  <path d="M0,0 L11,4.5 L0,9" fill="none" stroke="#8fa1b3" stroke-width="1.4"/></marker>
<marker id="arwk" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
  <path d="M0,0 L11,4.5 L0,9" fill="none" stroke="#1f2933" stroke-width="1.4"/></marker>
<marker id="arwp" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
  <path d="M0,0 L11,4.5 L0,9" fill="none" stroke="#9a6ec9" stroke-width="1.5"/></marker>
<marker id="arwi" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
  <path d="M0,0 L11,4.5 L0,9" fill="none" stroke="#3f9c6b" stroke-width="1.5"/></marker>
</defs>
<rect width="1420" height="1380" fill="#ffffff"/><text x="710.0" y="42" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="700" font-style="normal">Easy Trading — Layered Architecture</text><text x="710.0" y="64" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">redrawn from the code, 2026-10-01 — CFD trade model (long / short positions); the SQL functions and the two legacy live endpoints are gone</text><rect x="90" y="100" width="800" height="164" rx="7" fill="#f7efff" stroke="#9a6ec9" stroke-width="1.6"/><text x="490.0" y="126" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Presentation layer  ·  static/</text><rect x="118" y="148" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="237" y="167" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">index.html  ·  demo-trading.html</text><rect x="376" y="148" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="495" y="167" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">js/search.js  ·  js/watchlist.js</text><rect x="634" y="148" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="753" y="167" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">js/auth.js  ·  js/tips.js</text><rect x="118" y="186" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="237" y="205" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">js/demo-trading.js</text><rect x="376" y="186" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="495" y="205" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">js/journal.js</text><rect x="634" y="186" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="753" y="205" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">css/  (4 stylesheets)</text><text x="490.0" y="252" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Served by the backend itself — one origin, no separate frontend server.</text><rect x="90" y="340" width="800" height="200" rx="7" fill="#eef4ff" stroke="#5b86d6" stroke-width="1.6"/><text x="490.0" y="366" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">REST layer  ·  *Controller</text><rect x="118" y="388" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="237" y="407" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentController</text><rect x="376" y="388" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="495" y="407" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PriceController</text><rect x="634" y="388" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="753" y="407" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">AuthController</text><rect x="118" y="426" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="237" y="445" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">WatchlistController</text><rect x="376" y="426" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="495" y="445" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">LivePriceController</text><rect x="634" y="426" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="753" y="445" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">TradeController</text><rect x="118" y="464" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="237" y="483" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">JournalController</text><rect x="376" y="464" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="495" y="483" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">ApiExceptionHandler</text><text x="490.0" y="528" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Everything under /api/** is JSON. Never touches a Repository directly.</text><rect x="90" y="580" width="800" height="200" rx="7" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.6"/><text x="490.0" y="606" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Business logic layer  ·  *Service</text><rect x="118" y="628" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="237" y="647" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentSearchService</text><rect x="376" y="628" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="495" y="647" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PriceService  ·  SignalService</text><rect x="634" y="628" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="753" y="647" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">Interval (window + staleness)</text><rect x="118" y="666" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="237" y="685" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">AuthService  ·  SessionUser</text><rect x="376" y="666" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="495" y="685" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">WatchlistService</text><rect x="634" y="666" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="753" y="685" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">LivePriceService · LiveCandleService</text><rect x="118" y="704" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="237" y="723" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">TradeService</text><rect x="376" y="704" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="495" y="723" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">JournalService</text><text x="490.0" y="768" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Owns the candle window, the staleness rule, the live 1 min candle series, the CFD margin and P&amp;L rules and journal ownership.</text><rect x="90" y="820" width="800" height="200" rx="7" fill="#e9f7ef" stroke="#3f9c6b" stroke-width="1.6"/><text x="490.0" y="846" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Persistence layer  ·  *Repository</text><rect x="118" y="868" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="237" y="887" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentRepository</text><rect x="376" y="868" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="495" y="887" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PriceRepository</text><rect x="634" y="868" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="753" y="887" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">UserRepository</text><rect x="118" y="906" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="237" y="925" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">WatchlistRepository</text><rect x="376" y="906" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="495" y="925" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">TradeRepository</text><rect x="634" y="906" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="753" y="925" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">JournalRepository</text><rect x="118" y="944" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="237" y="963" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">Instrument · Price · User entities</text><rect x="376" y="944" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="495" y="963" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">WatchlistEntry · Trade · JournalEntry</text><text x="490.0" y="1008" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Spring Data JPA. ddl-auto: validate — never creates or alters tables.</text><line x1="490.0" y1="264.0" x2="490.0" y2="338.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="490.0" y1="540.0" x2="490.0" y2="578.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="490.0" y1="780.0" x2="490.0" y2="818.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><rect x="90" y="1060" width="800" height="116" rx="7" fill="#e9f7ef" stroke="#3f9c6b" stroke-width="1.6"/><text x="490.0" y="1086" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">PostgreSQL  ·  db/schema.sql</text><text x="490.0" y="1104" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">instrument · price_candle (PK: symbol, interval, datetime) · app_user</text><text x="490.0" y="1126" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">watchlist · trade · journal_entry</text><text x="490.0" y="1154" font-size="11" fill="#8a5a2b" text-anchor="middle" font-weight="normal" font-style="italic">Tables, keys and CHECK constraints only — cash_balance &gt;= 0, trade_closed_atomically. No SQL functions.</text><line x1="490.0" y1="1020.0" x2="490.0" y2="1058.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><rect x="950" y="580" width="380" height="164" rx="7" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.6"/><text x="1140.0" y="606" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Integration layer  ·  *Client</text><rect x="972" y="632" width="336" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="1140" y="651" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">MarketDataClient → TwelveDataMarketDataClient</text><rect x="972" y="670" width="336" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="1140" y="689" font-size="10" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">LivePriceClient → FinnhubTradeStream (+ REST fallback)</text><text x="1140.0" y="720" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Called by the business logic layer, never by a Controller.</text><line x1="890.0" y1="660.0" x2="948.0" y2="660.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><rect x="950" y="820" width="182" height="118" rx="7" fill="#fff3e3" stroke="#d3902f" stroke-width="1.6"/><text x="1041.0" y="846" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Twelve Data</text><text x="1041" y="866" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">/time_series</text><text x="1041" y="890" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">outputsize is always</text><text x="1041" y="906" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">sent — default is 30</text><rect x="1148" y="820" width="182" height="118" rx="7" fill="#fff3e3" stroke="#d3902f" stroke-width="1.6"/><text x="1239.0" y="846" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Finnhub</text><text x="1239" y="866" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">trade WebSocket</text><text x="1239" y="890" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">~20 trades/s; the REST</text><text x="1239" y="906" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">quote is fallback only</text><line x1="1041.0" y1="746.0" x2="1041.0" y2="818.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="1239.0" y1="746.0" x2="1239.0" y2="818.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><path d="M90,1210 h1226 l14,14 v122 h-1240 v-136 z" fill="#fffdf2" stroke="#d9c98a" stroke-width="1.2"/><path d="M1316,1210 v14 h14" fill="none" stroke="#d9c98a" stroke-width="1.2"/><text x="101" y="1231" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">Layer rule, enforced by naming rather than by folder structure: a Controller always goes through a Service, never</text><text x="101" y="1246" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">straight to a Repository or a Client. Packages are organised by feature — instrument/, price/, marketdata/, liveprice/,</text><text x="101" y="1261" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">user/, watchlist/, trading/, journal/ — so one use case lives in one folder, and the layer a class belongs to is carried</text><text x="101" y="1276" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">by its *Controller / *Service / *Repository / *Client suffix.</text><text x="101" y="1291" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="101" y="1306" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">journal/ depends on user/, instrument/ and trading/ — and deliberately on neither price/ nor liveprice/. Dropping the</text><text x="101" y="1321" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">price snapshot UC05 originally specified removed that dependency entirely, and with it the rule that a journal write</text><text x="101" y="1336" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">must never cost an upstream API call: there is no longer anything to guard.</text><text x="710.0" y="1364" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Interfaces are named without an I-prefix: MarketDataClient, not IMarketDataClient. There is no ITradingService.</text></svg>