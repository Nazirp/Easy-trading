<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1010" viewBox="0 0 1420 1010" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<defs>
<marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
  <path d="M0,0 L10,4 L0,8 z" fill="#8fa1b3"/></marker>
<marker id="arwo" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
  <path d="M0,0 L11,4.5 L0,9" fill="none" stroke="#8fa1b3" stroke-width="1.4"/></marker>
<marker id="arwk" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
  <path d="M0,0 L11,4.5 L0,9" fill="none" stroke="#1f2933" stroke-width="1.4"/></marker>
<marker id="arwp" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
  <path d="M0,0 L11,4.5 L0,9" fill="none" stroke="#9a6ec9" stroke-width="1.5"/></marker>
<marker id="arwi" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
  <path d="M0,0 L11,4.5 L0,9" fill="none" stroke="#3f9c6b" stroke-width="1.5"/></marker>
</defs>
<rect width="1420" height="1010" fill="#ffffff"/><text x="710.0" y="42" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="700" font-style="normal">Easy Trading — Layered Architecture</text><text x="710.0" y="64" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">redrawn from the code, 2026-08-31 — supersedes the 19 Aug diagram</text><rect x="90" y="100" width="800" height="126" rx="7" fill="#f7efff" stroke="#9a6ec9" stroke-width="1.6"/><text x="490.0" y="126" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Presentation layer  ·  static/</text><rect x="118" y="148" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="237" y="167" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">index.html</text><rect x="376" y="148" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="495" y="167" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">js/search.js</text><rect x="634" y="148" width="238" height="30" rx="5" fill="#ffffff" stroke="#9a6ec9" stroke-width="1.1"/><text x="753" y="167" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">css/style.css</text><text x="490.0" y="214" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Served by the backend itself — one origin, no separate frontend server.</text><rect x="90" y="262" width="800" height="126" rx="7" fill="#eef4ff" stroke="#5b86d6" stroke-width="1.6"/><text x="490.0" y="288" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">REST layer  ·  *Controller</text><rect x="118" y="310" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="237" y="329" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentController</text><rect x="376" y="310" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="495" y="329" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PriceController</text><rect x="634" y="310" width="238" height="30" rx="5" fill="#ffffff" stroke="#5b86d6" stroke-width="1.1"/><text x="753" y="329" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">ApiExceptionHandler</text><text x="490.0" y="376" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Everything under /api/** is JSON. Never touches a Repository directly.</text><rect x="90" y="424" width="800" height="126" rx="7" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.6"/><text x="490.0" y="450" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Business logic layer  ·  *Service</text><rect x="118" y="472" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="237" y="491" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentSearchService</text><rect x="376" y="472" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="495" y="491" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PriceService</text><rect x="634" y="472" width="238" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="753" y="491" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">Interval (window + staleness)</text><text x="490.0" y="538" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Owns the candle window per interval and the cache-staleness rule.</text><rect x="90" y="586" width="800" height="126" rx="7" fill="#e9f7ef" stroke="#3f9c6b" stroke-width="1.6"/><text x="490.0" y="612" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Persistence layer  ·  *Repository</text><rect x="118" y="634" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="237" y="653" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentRepository</text><rect x="376" y="634" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="495" y="653" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PriceRepository</text><rect x="634" y="634" width="238" height="30" rx="5" fill="#ffffff" stroke="#3f9c6b" stroke-width="1.1"/><text x="753" y="653" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">Instrument / Price entities</text><text x="490.0" y="700" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Spring Data JPA. ddl-auto: validate — never creates or alters tables.</text><line x1="490.0" y1="226.0" x2="490.0" y2="260.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="490.0" y1="388.0" x2="490.0" y2="422.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="490.0" y1="550.0" x2="490.0" y2="584.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><rect x="90" y="750" width="800" height="104" rx="7" fill="#e9f7ef" stroke="#3f9c6b" stroke-width="1.6"/><text x="490.0" y="776" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">PostgreSQL  ·  db/schema.sql</text><text x="490.0" y="800" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">instrument   ·   price_candle  (PK: symbol, interval, datetime)</text><text x="490.0" y="828" font-size="11" fill="#8a5a2b" text-anchor="middle" font-weight="normal" font-style="italic">SQL functions in schema.sql are REFERENCE ONLY — the application never calls them.</text><line x1="490.0" y1="712.0" x2="490.0" y2="748.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><rect x="950" y="424" width="380" height="138" rx="7" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.6"/><text x="1140.0" y="450" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Integration layer  ·  *Client</text><rect x="972" y="470" width="336" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1"/><text x="1140" y="489" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">MarketDataClient → TwelveDataMarketDataClient</text><rect x="972" y="506" width="336" height="30" rx="5" fill="#ffffff" stroke="#3d6fc4" stroke-width="1.1" stroke-dasharray="5 4"/><text x="1140" y="525" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">LivePriceClient  (paper contract, MS4)</text><text x="1140.0" y="550" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Called by the business logic layer, never by a Controller.</text><line x1="890.0" y1="487.0" x2="948.0" y2="487.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><rect x="950" y="630" width="182" height="118" rx="7" fill="#fff3e3" stroke="#d3902f" stroke-width="1.6"/><text x="1041.0" y="656" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Twelve Data</text><text x="1041" y="676" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">/time_series</text><text x="1041" y="700" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">outputsize is always</text><text x="1041" y="716" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">sent — default is 30</text><rect x="1148" y="630" width="182" height="118" rx="7" fill="#fff3e3" stroke="#d3902f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1239.0" y="656" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Finnhub  (MS4)</text><text x="1239" y="676" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">quote, every 5 s</text><text x="1239" y="700" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">one price point per</text><text x="1239" y="716" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">poll, not a candle</text><line x1="1041.0" y1="564.0" x2="1041.0" y2="628.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="1239.0" y1="564.0" x2="1239.0" y2="628.0" stroke="#8fa1b3" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arw)"/><path d="M90,886 h786 l14,14 v68 h-800 v-82 z" fill="#fffdf2" stroke="#d9c98a" stroke-width="1.2"/><path d="M876,886 v14 h14" fill="none" stroke="#d9c98a" stroke-width="1.2"/><text x="101" y="907" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">Layer rule, enforced by naming rather than by folder structure: a Controller always goes through a Service, never</text><text x="101" y="922" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">straight to a Repository or a Client. Packages are organised by feature (instrument/, price/, marketdata/, liveprice/),</text><text x="101" y="937" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">so one use case lives in one folder — the layer a class belongs to is carried by its *Controller / *Service /</text><text x="101" y="952" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">*Repository / *Client suffix.</text><text x="710.0" y="994" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">Interfaces are named without an I-prefix: MarketDataClient, not IMarketDataClient. There is no ITradingService.</text></svg>