<rect width="1460" height="1000" fill="#ffffff"/><text x="730.0" y="42" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="700" font-style="normal">Easy Trading — Component Diagram</text><text x="730.0" y="64" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">redrawn from the code, 2026-08-31 — supersedes the 19 Aug diagram</text><rect x="60" y="92" width="900" height="706" rx="10" fill="none" stroke="#8fa1b3" stroke-width="1.8"/><text x="510.0" y="118" font-size="15" fill="#5c6b7a" text-anchor="middle" font-weight="600" font-style="normal">Easy Trading application  (single Spring Boot deployment, one origin)</text><rect x="100" y="140" width="360" height="128" rx="7" fill="#f7efff" stroke="#9a6ec9" stroke-width="1.6"/><text x="280.0" y="166" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Frontend  ::  static/</text><text x="280.0" y="185" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">search view · chart view · range switcher</text><text x="280.0" y="201" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">1w / 1m / 6m / 1yr</text><text x="280.0" y="217" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">glossary + description text (UC06)</text><rect x="426" y="152" width="22" height="16" fill="#fff" stroke="#9a6ec9" stroke-width="1.2"/><rect x="421" y="155" width="10" height="4" fill="#fff" stroke="#9a6ec9" stroke-width="1.1"/><rect x="421" y="162" width="10" height="4" fill="#fff" stroke="#9a6ec9" stroke-width="1.1"/><path d="M486,140 h420 l14,14 v114 h-434 v-128 z" fill="#fffdf2" stroke="#d9c98a" stroke-width="1.2"/><path d="M906,140 v14 h14" fill="none" stroke="#d9c98a" stroke-width="1.2"/><text x="497" y="161" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">UC06 Description is INSIDE the frontend component.</text><text x="497" y="176" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">No endpoint, no database table, no backend dependency —</text><text x="497" y="191" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">the frontend owns the set of terms it chooses to display,</text><text x="497" y="206" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">so a network round trip would be the wrong shape for a</text><text x="497" y="221" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">tooltip that has to appear instantly.</text><rect x="100" y="316" width="360" height="108" rx="7" fill="#eef4ff" stroke="#5b86d6" stroke-width="1.6"/><text x="280.0" y="342" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">REST API</text><text x="280.0" y="361" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentController · PriceController</text><text x="280.0" y="377" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">ApiExceptionHandler → ApiError</text><rect x="426" y="328" width="22" height="16" fill="#fff" stroke="#5b86d6" stroke-width="1.2"/><rect x="421" y="331" width="10" height="4" fill="#fff" stroke="#5b86d6" stroke-width="1.1"/><rect x="421" y="338" width="10" height="4" fill="#fff" stroke="#5b86d6" stroke-width="1.1"/><rect x="560" y="316" width="360" height="108" rx="7" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.6"/><text x="740.0" y="342" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Instrument Search</text><text x="740.0" y="361" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentSearchService</text><text x="740.0" y="377" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">database only — never calls Twelve Data</text><rect x="886" y="328" width="22" height="16" fill="#fff" stroke="#3d6fc4" stroke-width="1.2"/><rect x="881" y="331" width="10" height="4" fill="#fff" stroke="#3d6fc4" stroke-width="1.1"/><rect x="881" y="338" width="10" height="4" fill="#fff" stroke="#3d6fc4" stroke-width="1.1"/><rect x="100" y="470" width="360" height="128" rx="7" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.6"/><text x="280.0" y="496" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Price</text><text x="280.0" y="515" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PriceService · Interval</text><text x="280.0" y="531" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">window per interval (84/180/180/52)</text><text x="280.0" y="547" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">staleness = 1.5 × candle length</text><rect x="426" y="482" width="22" height="16" fill="#fff" stroke="#3d6fc4" stroke-width="1.2"/><rect x="421" y="485" width="10" height="4" fill="#fff" stroke="#3d6fc4" stroke-width="1.1"/><rect x="421" y="492" width="10" height="4" fill="#fff" stroke="#3d6fc4" stroke-width="1.1"/><rect x="560" y="470" width="360" height="128" rx="7" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.6"/><text x="740.0" y="496" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Market Data Client</text><text x="740.0" y="515" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">MarketDataClient (interface)</text><text x="740.0" y="531" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">TwelveDataMarketDataClient</text><text x="740.0" y="547" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">getCandles(symbol, interval, outputSize)</text><rect x="886" y="482" width="22" height="16" fill="#fff" stroke="#3d6fc4" stroke-width="1.2"/><rect x="881" y="485" width="10" height="4" fill="#fff" stroke="#3d6fc4" stroke-width="1.1"/><rect x="881" y="492" width="10" height="4" fill="#fff" stroke="#3d6fc4" stroke-width="1.1"/><rect x="100" y="646" width="360" height="104" rx="7" fill="#e9f7ef" stroke="#3f9c6b" stroke-width="1.6"/><text x="280.0" y="672" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Persistence</text><text x="280.0" y="691" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">InstrumentRepository · PriceRepository</text><text x="280.0" y="707" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">Instrument · Price entities</text><rect x="426" y="658" width="22" height="16" fill="#fff" stroke="#3f9c6b" stroke-width="1.2"/><rect x="421" y="661" width="10" height="4" fill="#fff" stroke="#3f9c6b" stroke-width="1.1"/><rect x="421" y="668" width="10" height="4" fill="#fff" stroke="#3f9c6b" stroke-width="1.1"/><rect x="560" y="646" width="360" height="104" rx="7" fill="#fafbfc" stroke="#c2ccd6" stroke-width="1.6" stroke-dasharray="6 4"/><text x="740.0" y="672" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Live Price Client   (MS4)</text><text x="740.0" y="691" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">LivePriceClient — paper contract</text><text x="740.0" y="707" font-size="11" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">no implementation yet</text><rect x="886" y="658" width="22" height="16" fill="#fff" stroke="#c2ccd6" stroke-width="1.2"/><rect x="881" y="661" width="10" height="4" fill="#fff" stroke="#c2ccd6" stroke-width="1.1"/><rect x="881" y="668" width="10" height="4" fill="#fff" stroke="#c2ccd6" stroke-width="1.1"/><line x1="280.0" y1="268.0" x2="280.0" y2="314.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="380.0" y1="424.0" x2="380.0" y2="468.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="460.0" y1="370.0" x2="558.0" y2="370.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="460.0" y1="534.0" x2="558.0" y2="534.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="280.0" y1="598.0" x2="280.0" y2="644.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="560.0" y1="400.0" x2="464.0" y2="664.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><rect x="1010" y="470" width="380" height="128" rx="7" fill="#fff3e3" stroke="#d3902f" stroke-width="1.6"/><text x="1200.0" y="496" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Twelve Data API</text><text x="1200.0" y="515" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">/time_series</text><text x="1200.0" y="531" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">candles, on a cache miss</text><text x="1200.0" y="547" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">or a stale cache</text><rect x="1010" y="646" width="380" height="104" rx="7" fill="#fff3e3" stroke="#d3902f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1200.0" y="672" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Finnhub API   (MS4)</text><text x="1200.0" y="691" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">quote endpoint, 5 s polling</text><text x="1200.0" y="707" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">one price point per poll, not a candle</text><line x1="920.0" y1="534.0" x2="1008.0" y2="534.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><line x1="920.0" y1="698.0" x2="1008.0" y2="698.0" stroke="#8fa1b3" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect x="100" y="852" width="360" height="96" rx="7" fill="#e9f7ef" stroke="#3f9c6b" stroke-width="1.6"/><text x="280.0" y="878" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">PostgreSQL</text><text x="280.0" y="897" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">instrument · price_candle</text><text x="280.0" y="913" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">SQL functions = reference only</text><line x1="280.0" y1="752.0" x2="280.0" y2="850.0" stroke="#8fa1b3" stroke-width="1.5" marker-end="url(#arw)"/><path d="M560,852 h816 l14,14 v82 h-830 v-96 z" fill="#fffdf2" stroke="#d9c98a" stroke-width="1.2"/><path d="M1376,852 v14 h14" fill="none" stroke="#d9c98a" stroke-width="1.2"/><text x="571" y="873" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">The signal is not a component. It is a field inside the /api/getPrice response (SignalResponse), so the frontend</text><text x="571" y="888" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">structurally cannot render a chart without its signal (UC02 BR1). Computation is SCRUM-46 and is not built yet —</text><text x="571" y="903" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">the field ships today with verdict NONE.</text><text x="571" y="918" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal"></text><text x="571" y="933" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">Note there is no arrow from Instrument Search to the Market Data Client: /api/search reads the database only.</text><text x="571" y="948" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">Dashed = defined but not implemented in this milestone.</text></svg>