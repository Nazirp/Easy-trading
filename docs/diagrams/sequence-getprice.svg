<rect width="1560" height="1120" fill="#ffffff"/><text x="780.0" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="700" font-style="normal">Easy Trading — Sequence: GET /api/getPrice</text><text x="780.0" y="62" font-size="12" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">UC02, drawn from PriceService.getPrices() — 2026-08-31</text><rect x="22" y="100" width="176" height="56" rx="6" fill="#f7efff" stroke="#9a6ec9" stroke-width="1.5"/><text x="110" y="124" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Beginner</text><text x="110" y="140" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">Trader</text><line x1="110" y1="158" x2="110" y2="1040" stroke="#8fa1b3" stroke-width="1.1" stroke-dasharray="5 6"/><rect x="212" y="100" width="176" height="56" rx="6" fill="#f7efff" stroke="#9a6ec9" stroke-width="1.5"/><text x="300" y="124" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Frontend</text><text x="300" y="140" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">search.js</text><line x1="300" y1="158" x2="300" y2="1040" stroke="#8fa1b3" stroke-width="1.1" stroke-dasharray="5 6"/><rect x="432" y="100" width="176" height="46" rx="6" fill="#eef4ff" stroke="#5b86d6" stroke-width="1.5"/><text x="520" y="130" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">PriceController</text><line x1="520" y1="158" x2="520" y2="1040" stroke="#8fa1b3" stroke-width="1.1" stroke-dasharray="5 6"/><rect x="672" y="100" width="176" height="46" rx="6" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.5"/><text x="760" y="130" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">PriceService</text><line x1="760" y1="158" x2="760" y2="1040" stroke="#8fa1b3" stroke-width="1.1" stroke-dasharray="5 6"/><rect x="902" y="100" width="176" height="46" rx="6" fill="#e9f7ef" stroke="#3f9c6b" stroke-width="1.5"/><text x="990" y="130" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">PriceRepository</text><line x1="990" y1="158" x2="990" y2="1040" stroke="#8fa1b3" stroke-width="1.1" stroke-dasharray="5 6"/><rect x="1122" y="100" width="176" height="46" rx="6" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.5"/><text x="1210" y="130" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">MarketDataClient</text><line x1="1210" y1="158" x2="1210" y2="1040" stroke="#8fa1b3" stroke-width="1.1" stroke-dasharray="5 6"/><rect x="1342" y="100" width="176" height="46" rx="6" fill="#fff3e3" stroke="#d3902f" stroke-width="1.5"/><text x="1430" y="130" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Twelve Data</text><line x1="1430" y1="158" x2="1430" y2="1040" stroke="#8fa1b3" stroke-width="1.1" stroke-dasharray="5 6"/><line x1="110.0" y1="200.0" x2="300.0" y2="200.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arwk)"/><text x="205.0" y="192" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">clicks range  1m</text><line x1="300.0" y1="248.0" x2="520.0" y2="248.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arwk)"/><text x="410.0" y="240" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">GET /api/getPrice?symbol=BTC/USD&amp;interval=4h</text><text x="410.0" y="262" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">interval alone identifies the range — no range or limit param</text><line x1="520.0" y1="310.0" x2="760.0" y2="310.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arwk)"/><text x="640.0" y="302" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">getPrices(symbol, "4h")</text><path d="M760,340 h54 v26 h-54" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arwk)"/><text x="822" y="344" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">Interval.fromCode("4h")</text><text x="822" y="360" font-size="10.5" fill="#5c6b7a" text-anchor="start" font-weight="normal" font-style="italic">unknown code → 400 INVALID_INTERVAL</text><line x1="760.0" y1="406.0" x2="990.0" y2="406.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arwk)"/><text x="875.0" y="398" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">most recent 180 candles, newest first</text><line x1="990.0" y1="452.0" x2="760.0" y2="452.0" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arwk)"/><text x="875.0" y="444" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">cached</text><path d="M760,482 h54 v26 h-54" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arwk)"/><text x="822" y="486" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">needsIngestion(cached, interval)</text><text x="822" y="502" font-size="10.5" fill="#5c6b7a" text-anchor="start" font-weight="normal" font-style="italic">MISSING / INSUFFICIENT / OK</text><rect x="230" y="540" width="1290" height="376" fill="none" stroke="#3d6fc4" stroke-width="1.3"/><path d="M230,540 h74 l0,20 l-12,10 H230 z" fill="#e6f0ff" stroke="#3d6fc4" stroke-width="1.3"/><text x="260" y="555" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="700" font-style="normal">alt</text><text x="314" y="556" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">[ OK — ≥ 2 candles and newest within 1.5 × candle length ]</text><text x="314" y="571" font-size="10.5" fill="#5c6b7a" text-anchor="start" font-weight="normal" font-style="italic">1.5× rather than exactly one candle: a closed market would otherwise read as permanently stale</text><line x1="760.0" y1="614.0" x2="520.0" y2="614.0" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arwk)"/><text x="640.0" y="606" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">the 180-candle window, oldest first</text><line x1="230" y1="648" x2="1520" y2="648" stroke="#3d6fc4" stroke-width="1.2" stroke-dasharray="7 5"/><text x="246" y="670" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="700" font-style="normal">else</text><text x="292" y="670" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">[ MISSING or INSUFFICIENT ]</text><path d="M760,700 h54 v26 h-54" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arwk)"/><text x="822" y="704" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">instrument unknown?</text><text x="822" y="720" font-size="10.5" fill="#5c6b7a" text-anchor="start" font-weight="normal" font-style="italic">→ 404 NOT_FOUND</text><line x1="760.0" y1="762.0" x2="1210.0" y2="762.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arwk)"/><text x="985.0" y="754" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">getCandles(symbol, "4h", 200)</text><text x="985.0" y="776" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">200 = 180 displayed + 20 warm-up candles for the signal</text><line x1="1210.0" y1="818.0" x2="1430.0" y2="818.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arwk)"/><text x="1320.0" y="810" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">/time_series?…&amp;outputsize=200</text><text x="1320.0" y="832" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">outputsize is always sent; omitted, Twelve Data returns only 30</text><line x1="1430.0" y1="866.0" x2="1210.0" y2="866.0" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arwk)"/><text x="1320.0" y="858" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">candles</text><line x1="760.0" y1="894.0" x2="990.0" y2="894.0" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arwk)"/><text x="875.0" y="886" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">save(...)  then re-read the window</text><line x1="520.0" y1="956.0" x2="300.0" y2="956.0" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arwk)"/><text x="410.0" y="948" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">PricesResponse { symbol, interval, prices[], signal }</text><text x="410.0" y="970" font-size="10.5" fill="#5c6b7a" text-anchor="middle" font-weight="normal" font-style="italic">signal.verdict is BUY/SELL/HOLD/NONE — computed since SCRUM-64 (SMA 10 vs SMA 20)</text><line x1="300.0" y1="1012.0" x2="110.0" y2="1012.0" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arwk)"/><text x="205.0" y="1004" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-style="normal">chart + plain-language signal label</text><path d="M60,1052 h766 l14,14 v40 h-780 v-54 z" fill="#fffdf2" stroke="#d9c98a" stroke-width="1.2"/><path d="M826,1052 v14 h14" fill="none" stroke="#d9c98a" stroke-width="1.2"/><text x="71" y="1073" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">The window and the staleness rule live in Java (Interval, needsIngestion) and nowhere else —</text><text x="71" y="1088" font-size="11" fill="#7a6a2e" text-anchor="start" font-weight="normal" font-style="normal">db/schema.sql holds tables and constraints only.</text></svg>