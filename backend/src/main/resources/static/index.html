<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Trading — Search</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page">
    <!-- SCRUM-68/SCRUM-73: page title on the left; the "Demo Trading" nav
         button and whoever is signed in share the right side of the same
         row, one compact header instead of a separate nav row. The account
         controls stay hidden until GET /api/me has answered, so the page
         never flashes a wrong state on load. -->
    <div class="topbar">
      <div class="topbar-left">
        <h1>Search an instrument</h1>
      </div>

      <div class="topbar-right">
        <a href="/demo-trading" class="nav-link nav-link-accent" data-locked-until-auth>Demo Trading</a>

        <!-- SCRUM-73 follow-up: one persistent segmented box (same look as
             the chart-type switcher) instead of two elements auth.js swaps
             in and out. Logged out, "Sign in" is the live segment and
             "Log out" is dim/disabled; logging in flips which one is live
             and swaps the label to the username. See auth.js's render(). -->
        <div id="account-switcher" class="account-switcher" role="group" aria-label="Account" hidden>
          <button type="button" id="account-primary" class="account-segment" data-auth-open="login">Sign in</button>
          <button type="button" id="logout-button" class="account-segment" disabled>Log out</button>
        </div>
      </div>
    </div>

    <!-- SCRUM-51: collapsed "currently chosen instrument" pill (defaults to
         BTC) that expands into a live-updating search on click — no submit
         needed. Header row also carries the range switcher (SCRUM-63), the
         (decorative, not yet wired up) help button, and a real price/range
         readout for whatever instrument is currently loaded. -->
    <div class="header-row">
      <div class="instrument-selector">
        <button
          type="button"
          id="selector-toggle"
          class="selector-toggle"
          aria-expanded="false"
          aria-controls="dropdown-panel"
        >
          <span id="selector-dot" class="selector-dot" data-type="crypto" aria-hidden="true"></span>
          <span class="selector-info">
            <span id="selector-symbol" class="selector-symbol">BTC</span>
            <span id="selector-name" class="selector-name">Bitcoin</span>
          </span>
          <svg class="selector-chevron" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Floating dropdown card: search input + live results share one
             surface, matching the reference design (not a separate boxed
             panel). -->
        <div id="dropdown-panel" class="dropdown-panel" hidden>
          <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <line x1="11" y1="11" x2="15" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <label for="search-input" class="visually-hidden">Symbol or name</label>
            <input
              type="text"
              id="search-input"
              name="q"
              placeholder="Search…"
              autocomplete="off"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="results-list"
            >
          </div>

          <!-- UC01 step 8: live results (also shows a loading row while a
               request is in flight) -->
          <ul id="results-list" class="results-list" hidden></ul>

          <!-- Inline validation / fetch-failure message (UC01 2a / extension 4a) -->
          <p id="search-error" class="message message-error" hidden></p>

          <!-- UC01 step 7a: empty state -->
          <p id="empty-state" class="message message-empty" hidden></p>
        </div>
      </div>

      <!-- Decorative for now — plain-language description is SCRUM-43's
           own feature; not wired up here to avoid duplicating that. -->
      <button type="button" class="help-button" aria-label="About this instrument">?</button>

      <div class="price-ticker">
        <span id="ticker-price" class="ticker-price">—</span>
        <span id="ticker-change" class="ticker-change" hidden></span>
      </div>

      <!-- Chart type (SCRUM-73 follow-up): line vs candlesticks, the
           user's choice, not a second range control -- same button
           chrome as .range-button, sitting right beside it. Candles is the
           default (unchanged behaviour for anyone who never touches it). -->
      <div class="chart-type-switcher" role="group" aria-label="Chart type">
        <button type="button" class="chart-type-button is-active" data-chart-type="candles">Candles</button>
        <button type="button" class="chart-type-button" data-chart-type="line">Line</button>
      </div>

      <!-- SCRUM-63: users only ever see these four labels — the interval
           codes (2h/4h/1day/1week) they map to are an internal API detail
           and never appear here. Same dark-box treatment as the help
           button, blue glow ring on the active one (see .range-button in
           style.css). Sits at the far right of the header row. -->
      <div class="range-switcher" role="group" aria-label="Chart range">
        <button type="button" class="range-button" data-range="1w">1W</button>
        <button type="button" class="range-button" data-range="1m">1M</button>
        <button type="button" class="range-button" data-range="6m">6M</button>
        <button type="button" class="range-button" data-range="1yr">1YR</button>
      </div>
    </div>

    <!-- SCRUM-68: one line under the instrument/range row. Logged out it
         invites you to log in or sign up; logged in it becomes the watchlist
         strip (SCRUM-22 fills it — the markup and the slot are here so that
         story only has to add items, not move anything). Hidden entirely
         until GET /api/me answers. -->
    <!-- SCRUM-68/71: the watchlist strip. #account-prompt used to live in
         here too; it now sits in the topbar (see .topbar-right above) so
         the two login/signup buttons and the account controls share one
         slot. This wrapper stays -- auth.js reaches into #account-bar
         unconditionally -- but now it only ever holds the watchlist. -->
    <div id="account-bar" class="account-bar" hidden>
      <div id="watchlist-strip" class="watchlist-strip" data-locked-until-auth>
        <span class="watchlist-label">Watchlist</span>
        <!-- SCRUM-71: watchlist.js fills the list and reuses this line for
             the empty state, short messages ("Already on your watchlist"),
             and the locked-out state, so the strip never changes height. -->
        <span id="watchlist-empty" class="watchlist-empty">Nothing saved yet.</span>
        <ul id="watchlist-items" class="watchlist-items" hidden></ul>
      </div>
    </div>

    <!-- UC01 step 11 / SCRUM-63: instrument detail and chart -->
    <section id="detail" class="detail" hidden>
      <div class="detail-header">
        <h2 id="detail-title"></h2>
      </div>

      <p id="detail-meta" class="detail-meta"></p>
      <p id="detail-error" class="message message-error" hidden></p>
      <p id="detail-empty" class="message message-empty" hidden></p>

      <div class="chart-area">
        <!-- /api/getPrice can hit Twelve Data on a cache miss and take a
             second or more — this covers that instead of the chart just
             sitting there. -->
        <div id="chart-loading" class="chart-loading" hidden>Loading chart…</div>
        <div id="chart-container" class="chart-container"></div>
        <!-- Follows the mouse over the chart: shows the exact O/H/L/C for
             whichever candle is under the cursor (SCRUM-63 follow-up). -->
        <div id="chart-tooltip" class="chart-tooltip" hidden></div>
      </div>

      <!-- SCRUM-65: the signal /api/getPrice already returns with every
           price response. Always shown alongside the chart, never a
           separate view or extra step (UC02 BR1) — including the neutral
           "NONE" verdict, which is what every instrument returns today
           until SCRUM-64 lands. Verdict is never colour-only: the badge
           always pairs its colour with an icon and the backend's own
           plain-language label. -->
      <div id="signal-panel" class="signal-panel" hidden>
        <div id="signal-badge" class="signal-badge" data-verdict="NONE">
          <span id="signal-icon" class="signal-icon" aria-hidden="true"></span>
          <span id="signal-label" class="signal-label"></span>
        </div>
        <p id="signal-explanation" class="signal-explanation" hidden></p>
        <p class="signal-disclaimer">Not financial advice — for learning purposes only.</p>
      </div>
    </section>
  </main>

  <!-- SCRUM-68: log in / sign up. One dialog, two modes — /api/signup and
       /api/login take the identical body, so the form is the same and only
       the wording and the endpoint change.

       A native <dialog> rather than a hand-rolled overlay: it gives focus
       trapping, Escape-to-close and inert background content for free, and
       those are the parts a hand-rolled modal usually gets wrong.

       novalidate because the browser's own "please fill in this field"
       bubble cannot say what we need it to (a username of only spaces is
       not empty as far as `required` is concerned) — validation is in
       auth.js so there is one set of messages. -->
  <dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-title">
    <form id="auth-form" class="auth-form" novalidate>
      <h2 id="auth-title" class="auth-title">Sign in</h2>
      <p id="auth-subtitle" class="auth-subtitle"></p>
      <p class="auth-context">Sign in to unlock the watchlist and demo trading features.</p>

      <label class="auth-label" for="auth-username">Username</label>
      <input type="text" id="auth-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false">

      <label class="auth-label" for="auth-password">Password</label>
      <input type="password" id="auth-password" name="password" autocomplete="current-password">

      <p id="auth-error" class="message message-error" hidden></p>

      <div class="auth-actions">
        <button type="button" id="auth-cancel" class="auth-cancel">Cancel</button>
        <button type="submit" id="auth-submit" class="auth-submit">Sign in</button>
      </div>

      <p class="auth-switch">
        <span id="auth-switch-text"></span>
        <button type="button" id="auth-switch" class="link-button"></button>
      </p>
    </form>
  </dialog>

  <script src="js/auth.js"></script>
  <!-- watchlist.js after search.js on purpose: it registers itself through
       window.EasyTrading.onRenderInstrument, which search.js defines. -->
  <script src="js/search.js"></script>
  <script src="js/watchlist.js"></script>
</body>
</html>
