spring:
  application:
    name: easy-trading-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/easytrading
    username: easytrading
    password: ${DB_PASSWORD:easytrading}
  jpa:
    open-in-view: false
    hibernate:
      # db/schema.sql owns the schema (applied by Docker Compose / manually).
      # Hibernate only validates the entity mapping against it, never
      # generates or alters tables itself.
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        # The session cookie is the whole of the login state the browser holds.
        # http-only keeps it out of reach of JavaScript, so an XSS
        # bug on any page cannot read it and impersonate the user; same-site lax
        # stops another site from making authenticated requests on the user's
        # behalf. `secure` stays off because local development is plain HTTP --
        # turn it on wherever this is deployed over HTTPS.
        http-only: true
        same-site: lax
      # Idle sessions expire. Stated explicitly rather than left to the
      # container's default, so the value is reviewable.
      timeout: 30m

marketdata:
  twelvedata:
    base-url: ${TWELVEDATA_BASE_URL:https://api.twelvedata.com}
    api-key: ${TWELVEDATA_API_KEY:}

liveprice:
  finnhub:
    # REST quote. This is the FALLBACK, not the live source: it is
    # the cold-start seed before the first trade arrives and what answers while
    # the stream is reconnecting.
    base-url: ${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
    api-key: ${FINNHUB_API_KEY:}
    # Trade stream -- the real live source. One connection per server,
    # opened at startup, ~20 trades/second for BTC/USD.
    ws-url: ${FINNHUB_WS_URL:wss://ws.finnhub.io}
    # Set false to run without the socket. The stream also stays down
    # when no api-key is set, so a machine without a Finnhub key still boots.
    stream-enabled: ${FINNHUB_STREAM_ENABLED:true}
  # How old the held price may be before we stop trusting the stream and fall back
  # to the REST quote -- and, if that fails too, tell the browser `outdated: true`.
  max-price-age: 6s
